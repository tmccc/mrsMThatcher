[mypy]
python_version = 3.10
files =
    mrs_log_digest.py,
    mrs_log_digest_contracts.py,
    mrs_log_digest_analysis.py,
    mrs_log_digest_records.py,
    mrs_log_digest_context.py,
    mrs_log_digest_input_io.py,
    mrs_log_digest_transactions.py,
    mrs_log_digest_api_health.py,
    mrs_log_digest_provider_observations.py,
    mrs_log_digest_runtime.py,
    mrs_log_digest_state_reporting.py,
    mrs_log_digest_single_call.py,
    mrs_log_digest_reply_evidence.py,
    mrs_log_digest_reply_text.py,
    mrs_log_digest_quote_publication.py,
    mrs_log_digest_incidents.py
follow_imports = silent
check_untyped_defs = True
disallow_any_unimported = True
disallow_any_generics = True
disallow_untyped_calls = True
disallow_untyped_defs = True
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
strict_bytes = True
show_error_codes = True

[mypy-mrs_log_digest_contracts,mrs_log_digest_analysis]
disallow_incomplete_defs = True
disallow_subclassing_any = True
disallow_untyped_decorators = True
no_implicit_reexport = True
extra_checks = True
